services:
  database:
    image: 'postgres:16-alpine'
    container_name: traintogether-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traintogetheruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-traintogetherdb}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traintogetheruser} -d ${POSTGRES_DB:-traintogetherdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: 'minio/minio:latest'
    container_name: traintogether-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data_dev:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"  # API
      - "${MINIO_PORT_UI:-9001}:9001"  # Web UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data_dev:
  minio_data_dev:
