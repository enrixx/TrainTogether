<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageContent)" >
<head>
    <meta charset="UTF-8">
    <title>TrainTogether</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="vh-100 d-flex flex-column">

    <header th:replace="~{fragments/appbar :: appbar}"></header>

    <!-- Hauptbereich darunter: Sidebar + Content -->
    <main class="d-flex flex-grow-1 overflow-hidden">
        <aside th:replace="~{fragments/sidebar :: nav-sidebar}" class="flex-shrink-0"></aside>
        <div class="flex-grow-1 overflow-auto">
            <section th:insert="${pageContent}"></section>
        </div>
    </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="/js/theme-toggle.js"></script>

</html>
