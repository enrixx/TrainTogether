<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'Admin Dashboard'">Admin Dashboard</title>
</head>
<body>
<div th:fragment="content">
    <div class="container mt-4">
        <h2>Admin Dashboard</h2>

        <!-- Success Message -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Error Message -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row mb-4">
            <!-- Statistics Cards -->
            <div class="col-md-4 mb-3">
                <div class="card bg-warning text-white">
                    <div class="card-body">
                        <h5 class="card-title">Pending Requests</h5>
                        <h2 class="mb-0" th:text="${pendingCount}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card bg-info text-white">
                    <div class="card-body">
                        <h5 class="card-title">Total Requests</h5>
                        <h2 class="mb-0" th:text="${allRequests.size()}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <a th:href="@{/admin/gym-owner-requests(filter='pending')}" class="btn btn-primary me-2">
                            View Pending Requests
                            <span th:if="${pendingCount > 0}" class="badge bg-danger ms-1" th:text="${pendingCount}">0</span>
                        </a>
                        <a th:href="@{/admin/gym-owner-requests}" class="btn btn-secondary">View All Requests</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Pending Requests -->
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Recent Pending Requests</h5>
                        <a th:href="@{/admin/gym-owner-requests(filter='pending')}" class="btn btn-sm btn-outline-primary">View All</a>
                    </div>
                    <div class="card-body">
                        <div th:if="${pendingRequests.isEmpty()}" class="text-center text-muted py-4">
                            <p>No pending requests at the moment.</p>
                        </div>
                        <div th:unless="${pendingRequests.isEmpty()}" class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>User</th>
                                        <th>Email</th>
                                        <th>Requested Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="request, iterStat : ${pendingRequests}" th:if="${iterStat.index < 5}">
                                        <td>
                                            <span th:text="${request.user.firstName + ' ' + request.user.lastName}">User Name</span>
                                        </td>
                                        <td th:text="${request.user.email}">user@example.com</td>
                                        <td th:text="${#temporals.format(request.requestedAt, 'dd MMM yyyy HH:mm')}">Date</td>
                                        <td>
                                            <a th:href="@{/admin/gym-owner-requests(filter='pending')}" class="btn btn-sm btn-info">View Details</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
