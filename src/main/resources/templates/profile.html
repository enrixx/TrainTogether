<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: layout(~{::content})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: #{profile.title}">Profile</title>
</head>
<body>
<div th:fragment="content" class="overflow-auto h-100">
    <div class="container mt-4">
        <h2 th:text="#{profile.title}">Profile</h2>

        <!-- Success Message -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Error Message -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row">
            <!-- Profile Picture Card -->
            <div class="col-md-12 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0" th:text="#{profile.picture.title}">Profile Picture</h5>
                    </div>
                    <div class="card-body text-center">
                        <div class="mb-3">
                            <img th:if="${user.profilePictureUrl != null and !#strings.isEmpty(user.profilePictureUrl)}"
                                 th:src="${user.profilePictureUrl}"
                                 alt="Profile Picture"
                                 class="rounded-circle"
                                 style="width: 150px; height: 150px; object-fit: cover; border: 3px solid #dee2e6;">
                            <div th:unless="${user.profilePictureUrl != null and !#strings.isEmpty(user.profilePictureUrl)}"
                                 class="rounded-circle bg-secondary d-inline-flex align-items-center justify-content-center"
                                 style="width: 150px; height: 150px; border: 3px solid #dee2e6;">
                                <span class="text-white fs-1" th:text="${user.firstName != null ? #strings.substring(user.firstName, 0, 1) + #strings.substring(user.lastName, 0, 1) : '?'}">JD</span>
                            </div>
                        </div>
                        <div th:replace="~{fragments/edit-picture :: upload(endpointUrl=@{/profile/upload-picture})}"></div>
                        <div th:replace="~{fragments/edit-picture :: delete(endpointUrl=@{/profile/delete-picture},pictureUrl=${user.profilePictureUrl})}"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Profile Information Card -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0" th:text="#{profile.info.title}">Profile Information</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/profile/update}" th:object="${updateProfileDto}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label" th:text="#{profile.label.email}">Email</label>
                                <input type="email"
                                       class="form-control"
                                       th:class="${#fields.hasErrors('email')} ? 'form-control is-invalid' : 'form-control'"
                                       id="email"
                                       th:field="*{email}"
                                       th:placeholder="#{profile.label.email}">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                    Email error
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="firstName" class="form-label" th:text="#{auth.firstname}">First Name</label>
                                <input type="text"
                                       class="form-control"
                                       th:class="${#fields.hasErrors('firstName')} ? 'form-control is-invalid' : 'form-control'"
                                       id="firstName"
                                       th:field="*{firstName}"
                                       th:placeholder="#{auth.firstname}"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">
                                    First name error
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="lastName" class="form-label" th:text="#{auth.lastname}">Last Name</label>
                                <input type="text"
                                       class="form-control"
                                       th:class="${#fields.hasErrors('lastName')} ? 'form-control is-invalid' : 'form-control'"
                                       id="lastName"
                                       th:field="*{lastName}"
                                       th:placeholder="#{auth.lastname}"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">
                                    Last name error
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="gender" class="form-label" th:text="#{auth.gender}">Gender</label>
                                <select th:field="*{gender}" id="gender" class="form-select" required>
                                    <option value="" disabled selected th:text="#{auth.gender.placeholder}">Select Gender</option>
                                    <option value="male" th:text="#{auth.gender.male}">Male</option>
                                    <option value="female" th:text="#{auth.gender.female}">Female</option>
                                    <option value="divers" th:text="#{auth.gender.divers}">Divers</option>
                                </select>
                                <div class="text-danger" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="birthday" class="form-label" th:text="#{auth.birthday}">Birthday</label>
                                <input type="date" th:field="*{birthday}" id="birthday" class="form-control"
                                       th:placeholder="#{auth.birthday}" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('birthday')}" th:errors="*{birthday}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="bio" class="form-label" th:text="#{profile.bio.label}">Bio</label>
                                <textarea class="form-control"
                                          th:class="${#fields.hasErrors('bio')} ? 'form-control is-invalid' : 'form-control'"
                                          id="bio"
                                          th:field="*{bio}"
                                          rows="3"
                                          th:placeholder="#{profile.bio.placeholder}"></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}">
                                    Bio error
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" th:text="#{profile.member.since}">Member Since</label>
                                <p class="form-control-plaintext" th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2024</p>
                            </div>

                            <button type="submit" class="btn btn-primary w-100" th:text="#{profile.update.button}">Update Profile</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Change Password Card -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0" th:text="#{profile.change.password.title}">Change Password</h5>
                    </div>
                    <div class="card-body">
                        <!-- Password Error Message -->
                        <div th:if="${passwordError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <span th:text="${passwordError}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/profile/update-password}" th:object="${updateProfileDto}" method="post">
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label" th:text="#{profile.change.password.current}">Current Password</label>
                                <input type="password"
                                       class="form-control"
                                       id="currentPassword"
                                       th:field="*{currentPassword}"
                                       th:placeholder="#{profile.change.password.current}"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="newPassword" class="form-label" th:text="#{profile.change.password.new}">New Password</label>
                                <input type="password"
                                       class="form-control"
                                       id="newPassword"
                                       th:field="*{newPassword}"
                                       th:placeholder="|#{profile.change.password.new} (min. 6 characters)|"
                                       minlength="6"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label" th:text="#{profile.change.password.confirm}">Confirm New Password</label>
                                <input type="password"
                                       class="form-control"
                                       id="confirmPassword"
                                       th:field="*{confirmPassword}"
                                       th:placeholder="#{profile.change.password.confirm}"
                                       minlength="6"
                                       required>
                            </div>

                            <button type="submit" class="btn btn-warning w-100" th:text="#{profile.change.password.button}">Change Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gym Owner Request Section (only for regular users without any request) -->
        <div class="row" sec:authorize="hasAuthority('USER')">
            <div class="col-md-12 mb-4">
                <div class="card border-primary">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0" th:text="#{gym.owner.request.cta.title}">Are you a gym owner?</h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-3" th:text="#{gym.owner.request.cta.message}">Apply to register your gym on TrainTogether and reach more customers!</p>
                        <div class="text-center">
                            <a th:href="@{/gym-owner-request}" class="btn btn-primary btn-lg" th:text="#{gym.owner.request.cta.button}">Apply for Gym Owner Role</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                if (window.location.hash) {
                    const targetId = window.location.hash.substring(1);
                    const targetElement = document.getElementById(targetId);
                    if (targetElement) {
                        setTimeout(() => {
                            targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            targetElement.classList.add('border', 'border-primary', 'border-3');
                            setTimeout(() => {
                                targetElement.classList.remove('border', 'border-primary', 'border-3');
                            }, 2000);
                            targetElement.focus();
                        }, 300);
                    }
                }
            });
        </script>
    </div>
</div>
</body>
</html>
