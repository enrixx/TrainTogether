<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::content})}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{map.title}">Karte</title>
</head>
<body>
<div th:fragment="content" class="h-100 d-flex flex-column">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <div class="container mt-4 flex-grow-1 d-flex flex-column" style="min-height: 0;">
        <h2 th:text="#{map.title}">Sport-Karte</h2>

        <div class="card p-3 mb-3 flex-shrink-0">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="search-city" class="form-label" th:text="#{map.search.city}">Stadt</label>
                    <input type="text" id="search-city" class="form-control" th:placeholder="#{map.search.city.placeholder}">
                </div>
                <div class="col-md-2">
                    <label for="search-radius" class="form-label" th:text="#{map.search.radius}">Radius (km)</label>
                    <input type="number" id="search-radius" class="form-control" value="5" min="1">
                </div>
                <div class="col-md-2">
                    <button id="btn-search" type="button" class="btn btn-primary w-100" th:text="#{map.search.button}">Suchen</button>
                </div>
                <div class="col-md-2">
                    <button id="btn-clear-search" type="button" class="btn btn-secondary w-100" th:text="#{map.search.reset}">Zurücksetzen</button>
                </div>
            </div>

            <div class="mt-3">
                <div class="form-check form-check-inline">
                    <input type="checkbox" class="form-check-input" id="filter-gyms" checked>
                    <label class="form-check-label" for="filter-gyms" th:text="#{map.filter.all}">Alle Gyms</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="checkbox" class="form-check-input" id="filter-internal-only">
                    <label class="form-check-label" for="filter-internal-only" th:text="#{map.filter.partner}">Nur Partner-Gyms</label>
                </div>
            </div>
        </div>

        <div id="map" class="flex-grow-1 w-100" style="border-radius: 10px; margin-bottom: 20px;"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/map.js"></script>
</div>
</body>
</html>
