<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<div th:fragment="content">
  <head>
    <meta charset="UTF-8">
    <title>Karte</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      #map { height: 80vh; width: 100%; border-radius: 10px; }
    </style>
  </head>

  <body>

  <div  class="container mt-4">

    <h2>Sport-Karte</h2>

    <!-- Filter -->
    <div class="mb-3">
      <label class="form-check-label me-3">
        <input type="checkbox" class="form-check-input" id="filter-gyms" checked>
        Gyms
      </label>

      <label class="form-check-label me-3">
        <input type="checkbox" class="form-check-input" id="filter-parks" checked>
        Sportparks
      </label>

      <label class="form-check-label">
        <input type="checkbox" class="form-check-input" id="filter-custom" checked>
        Eigene Punkte
      </label>
    </div>

    <!-- Karte -->
    <div id="map"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="" crossorigin=""></script>

  <!-- Dein JS -->
  <script src="/js/map.js"></script>

  </body>
</div>
</html>
