<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="authlayout(authContent)">
<head>
    <meta charset="UTF-8">
    <title>Authenticate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>


<div class="d-flex justify-content-center py-4" style="margin-top: 20vh">
    <div class="w-auto border rounded-4 shadow-sm p-4 bg-white" style="min-width: 20rem;">
        <ul class="nav nav-tabs justify-content-center mb-3" role="tablist">
            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/login}" th:text="#{auth.sign.in}">Sign in</a>
            </li>
            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/register}" th:text="#{auth.register}">Register</a>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" role="tabpanel" aria-labelledby="tab-auth">
                <section th:insert="${authContent}"></section>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
