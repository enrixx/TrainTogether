<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{authenticate :: authlayout(~{::authContent})}">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<form th:fragment="authContent" th:action="@{/login}" method="post" class="mx-auto">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <h1 class="h3 mb-3 fw-normal" th:text="#{text.sign.in}">Please sign in</h1>

    <div class="form-floating mb-2">
        <input type="email" name="email" class="form-control" id="floatingInput"
               placeholder="name@example.com"
               required>
        <label for="floatingInput" th:text="#{auth.email}">Email address</label>
    </div>
    <div class="form-floating mb-3">
        <input type="password" name="password" class="form-control" id="floatingPassword"
               placeholder="Password"
               required>
        <label for="floatingPassword" th:text="#{auth.password}">Password</label>
    </div>
    <div th:if="${param.error != null}" class="alert alert-danger" th:text="#{error.wrong.credentials}">Wrong email or
        password
    </div>
    <div th:if="${param.registered == 'gym-owner'}" class="alert alert-success" role="alert">
        Registration successful! Your gym owner request is pending admin approval. You can log in once approved.
    </div>
    <div th:if="${successMessage != null}" class="alert alert-success" role="alert" th:text="${successMessage}">
        Success message
    </div>
    <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
        Error message
    </div>

    <button class="btn btn-primary w-100 py-2 mb-2" type="submit" th:text="#{auth.sign.in}">Sign in</button>

    <div class="text-center mb-3">
        <a th:href="@{/forgot-password}" class="text-decoration-none" th:text="#{auth.forgot.password}">Passwort vergessen?</a>
    </div>

    <div class="d-grid gap-2 mt-3">
        <a th:href="@{/register}" class="btn btn-outline-secondary py-2" role="button">
            <span th:text="#{auth.register}">Register</span>
        </a>
        <a th:href="@{/register/gym-owner}" class="btn btn-outline-primary py-2" role="button">
            <i class="bi bi-building me-2"></i>
            <span th:text="#{auth.register_gym_owner}">Register as Gym Owner</span>
        </a>
    </div>
</form>
</body>
</html>
