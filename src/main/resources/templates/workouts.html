<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{workouts.title}">Workouts</title>
    <!-- This head section is ignored by Thymeleaf layout -->
</head>
<body>
<div th:fragment="content" class="h-100 overflow-auto">
    <!-- Include Chart.js script here so it gets rendered -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <main class="container-fluid p-5">

        <!-- View for Existing Workout -->
        <div id="view-todays-workout" th:if="${todaysWorkout != null and not todaysWorkout.isEmpty()}">
            <div class="p-4 mb-4 bg-body-tertiary rounded-3">
                <div class="d-flex justify-content-between align-items-center">
                    <h3 th:text="#{workouts.today.title}">Today's Logged Workout</h3>
                    <div class="d-flex gap-2">
                        <a th:href="@{/workouts/previous}" class="btn btn-secondary" th:text="#{workouts.previous}">See Previous Workouts</a>
                        <button id="edit-workout-btn" class="btn btn-primary" th:text="#{workouts.edit}">Edit Workout</button>
                    </div>
                </div>
                <hr>
                <h5 th:text="${loggedDayName}"></h5>
                <ul class="list-group">
                    <li th:each="ex : ${todaysWorkout}" class="list-group-item">
                        <span th:text="${ex.exerciseName}" class="fw-bold"></span>
                        <span th:if="${ex.exerciseName != 'RESTDAY' and ex.exerciseName != 'Restday'}">
                             - <span th:text="${ex.sets} + ' ' + #{workouts.sets}"></span>
                             <br>
                             <small class="text-muted">
                                 <span th:text="#{workouts.reps}">Reps</span>: <span th:text="${ex.reps}"></span> |
                                 <span th:text="#{workouts.weight}">Weight</span>: <span th:text="${ex.weight}"></span> kg
                             </small>
                        </span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- View for Logging a New Workout -->
        <div id="log-new-workout" th:style="${todaysWorkout != null and not todaysWorkout.isEmpty() ? 'display: none;' : ''}">
            <!-- Header with Split Name and Edit Button -->
            <div class="p-4 mb-4 bg-body-tertiary rounded-3" >
                <div class="container-fluid m-0">
                    <div class="row">
                        <div class="col d-flex justify-content-start">
                            <h3 th:if="${split != null}" th:text="#{workouts.split.title} + ': ' + ${split.splitName}">Push-Pull-Legs</h3>
                            <h3 th:if="${split == null}" th:text="#{profile.split.notfound}">Kein aktiver Trainingssplit gefunden.</h3>
                        </div>
                        <div class="col d-flex justify-content-end gap-2">
                            <a th:href="@{/workouts/previous}" class="btn btn-secondary" th:if="${todaysWorkout == null or todaysWorkout.isEmpty()}" th:text="#{workouts.previous}">See Previous Workouts</a>
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editSplitModal" th:text="#{workouts.split.edit}">
                                Trainingssplit bearbeiten
                            </button>
                            <button id="cancel-edit-btn" class="btn btn-outline-secondary"
                                    th:if="${todaysWorkout != null and not todaysWorkout.isEmpty()}" th:text="#{workouts.cancel}">
                                Cancel
                            </button>
                        </div>
                    </div>
                    <hr>
                </div>

                <div class="row g-2 w-100" th:if="${split != null}">
                    <div class="col" th:each="day : ${split.days}">
                        <div class="p-2 border rounded-3 bg-body-secondary text-center h-100 d-flex flex-column w-100"
                             style="cursor: pointer;"
                             data-bs-toggle="collapse"
                             th:data-bs-target="'#collapse-day-' + ${day.id}"
                             aria-expanded="false"
                             th:aria-controls="'collapse-day-' + ${day.id}">

                            <strong th:text="${day.weekday}">Montag</strong>
                            <ul class="list-unstyled mt-2 flex-grow-1">
                                <li th:each="ex : ${day.personalExercises}" th:text="${ex.name} + ' - '   + 'X'  + ${ex.sets} "></li>
                                <li th:if="${#lists.isEmpty(day.personalExercises)}" class="text-muted">RESTDAY</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Collapsible Forms for Logging Workouts -->
            <div class="accordion" id="workoutAccordion" th:if="${split != null}">
                <div th:each="day : ${split.days}"
                     class="collapse mt-3"
                     th:classappend="${day.weekday.name() == currentDayOfWeek ? 'show' : ''}"
                     th:id="'collapse-day-' + ${day.id}"
                     data-bs-parent="#workoutAccordion">
                    <div class="card card-body">
                        <h4 th:text="#{workouts.log.header} + ': ' + ${day.weekday}"></h4>

                        <form class="workout-log-form" th:action="@{/workouts/log}" method="post">
                            <input type="hidden" name="trainingDayId" th:value="${day.id}"/>

                            <div class="planned-exercises">
                                <div th:each="exercise : ${day.personalExercises}" class="mb-3 row align-items-start exercise-log-row planned-row">
                                    <label class="col-sm-3 col-form-label fw-bold" th:text="${exercise.name}"></label>
                                    <input type="hidden" class="personal-exercise-id" th:value="${exercise.id}"/>
                                    <div class="col-sm-2">
                                        <div class="input-group">
                                            <span class="input-group-text" th:text="#{workouts.sets}">Sets</span>
                                            <input type="number" class="form-control sets-input" th:value="${exercise.sets}" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="reps-container d-flex flex-column gap-1"></div>
                                    </div>
                                    <div class="col-sm-1">
                                        <button type="button" class="btn btn-sm btn-danger remove-row-btn">X</button>
                                    </div>
                                </div>
                            </div>

                            <div class="adhoc-exercises-container"></div>

                            <button type="button" class="btn btn-outline-primary mt-3 add-adhoc-exercise-btn" th:text="#{workouts.add.exercise}">+ Add Extra Exercise</button>
                            <button type="submit" class="btn btn-success mt-3" th:text="#{workouts.log.button}">Log Workout</button>

                            <!-- Rest Day Button -->
                            <button type="submit" formaction="/workouts/log-restday" class="btn btn-info mt-3" th:text="#{workouts.restday.button}">Mark as Rest Day</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Progress Graph Section -->
        <div class="p-4 mt-4 bg-body-tertiary rounded-3">
            <h3 th:text="#{workouts.progress.title}">Progress Tracker</h3>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="progressExerciseSelect1" class="form-label">Exercise 1 (Blue)</label>
                    <select class="form-select progress-exercise-select" id="progressExerciseSelect1" data-color="blue">
                        <option value="" selected disabled th:text="#{workouts.progress.choose}">Choose exercise...</option>
                        <option th:each="ex : ${allExercises}" th:value="${ex.value}" th:text="${ex.name}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="progressExerciseSelect2" class="form-label">Exercise 2 (Red)</label>
                    <select class="form-select progress-exercise-select" id="progressExerciseSelect2" data-color="red">
                        <option value="" selected th:text="#{workouts.progress.choose}">Choose exercise...</option>
                        <option th:each="ex : ${allExercises}" th:value="${ex.value}" th:text="${ex.name}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="progressExerciseSelect3" class="form-label">Exercise 3 (Green)</label>
                    <select class="form-select progress-exercise-select" id="progressExerciseSelect3" data-color="green">
                        <option value="" selected th:text="#{workouts.progress.choose}">Choose exercise...</option>
                        <option th:each="ex : ${allExercises}" th:value="${ex.value}" th:text="${ex.name}"></option>
                    </select>
                </div>
            </div>

            <div class="mb-3 d-flex gap-2 justify-content-center">
                <button class="btn btn-outline-secondary time-filter-btn active" data-range="all">Gesamt</button>
                <button class="btn btn-outline-secondary time-filter-btn" data-range="year">1 Jahr</button>
                <button class="btn btn-outline-secondary time-filter-btn" data-range="month">1 Monat</button>
                <button class="btn btn-outline-secondary time-filter-btn" data-range="week">1 Woche</button>
            </div>

            <div style="height: 400px; position: relative;">
                <canvas id="progressChart"></canvas>
                <div id="chartMessage" class="position-absolute top-50 start-50 translate-middle text-muted" style="display: none;" th:text="#{workouts.progress.nodata}">
                    No data available for this exercise.
                </div>
            </div>
        </div>

        <!-- Include Edit Split Modal -->
        <div th:replace="~{fragments/training_dialogs/editSplitModal :: editSplitModal}"></div>

    </main>

    <script th:inline="javascript">
    /*<![CDATA[*/
        // Define server-side data as global JS variables
        window.loggedDayId = /*[[${loggedDayId}]]*/ null;
        window.todaysWorkout = /*[[${todaysWorkout}]]*/ null;
        window.allExercises = /*[[${allExercises}]]*/ [];
    /*]]>*/
    </script>
    <script src="/js/workout-logger.js"></script>
    <script src="/js/workout-progress-chart.js"></script>

    <style>
        .deleted-exercise { text-decoration: line-through; background-color: #ffe6e6; opacity: 0.7; }
    </style>
</div>
</body>
</html>
