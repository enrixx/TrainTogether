<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<head>
    <meta charset="UTF-8">
    <title>Workouts</title>
    <!-- This head section is ignored by Thymeleaf layout -->
</head>
<body>
<div th:fragment="content">
    <!-- Include Chart.js script here so it gets rendered -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <main class="container-fluid p-5">

        <!-- View for Existing Workout -->
        <div id="view-todays-workout" th:if="${todaysWorkout != null and not todaysWorkout.isEmpty()}">
            <div class="p-4 mb-4 bg-body-tertiary rounded-3">
                <div class="d-flex justify-content-between align-items-center">
                    <h3>Today's Logged Workout</h3>
                    <div class="d-flex gap-2">
                        <a th:href="@{/workouts/previous}" class="btn btn-secondary">See Previous Workouts</a>
                        <button id="edit-workout-btn" class="btn btn-primary">Edit Workout</button>
                    </div>
                </div>
                <hr>
                <h5 th:text="${loggedDayName}"></h5>
                <ul class="list-group">
                    <li th:each="ex : ${todaysWorkout}" class="list-group-item">
                        <span th:text="${ex.exerciseName}" class="fw-bold"></span>
                        <span th:if="${ex.exerciseName != 'RESTDAY' and ex.exerciseName != 'Restday'}">
                             - <span th:text="${ex.sets} + ' Sets'"></span>
                             <br>
                             <small class="text-muted">
                                 Reps: <span th:text="${ex.reps}"></span> |
                                 Weight: <span th:text="${ex.weight}"></span> kg
                             </small>
                        </span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- View for Logging a New Workout -->
        <div id="log-new-workout" th:style="${todaysWorkout != null and not todaysWorkout.isEmpty() ? 'display: none;' : ''}">
            <!-- Header with Split Name and Edit Button -->
            <div class="p-4 mb-4 bg-body-tertiary rounded-3" >
                <div class="container-fluid m-0">
                    <div class="row">
                        <div class="col d-flex justify-content-start">
                            <h3 th:if="${split != null}" th:text="'Training Split: ' + ${split.splitName}">Push-Pull-Legs</h3>
                        </div>
                        <div class="col d-flex justify-content-end gap-2">
                            <a th:href="@{/workouts/previous}" class="btn btn-secondary" th:if="${todaysWorkout == null or todaysWorkout.isEmpty()}">See Previous Workouts</a>
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editSplitModal">
                                Trainingssplit bearbeiten
                            </button>
                            <button id="cancel-edit-btn" class="btn btn-outline-secondary"
                                    th:if="${todaysWorkout != null and not todaysWorkout.isEmpty()}">
                                Cancel
                            </button>
                        </div>
                    </div>
                    <hr>
                </div>

                <div class="row g-2 w-100">
                    <div class="col" th:each="day : ${split?.days}">
                        <div class="p-2 border rounded-3 bg-body-secondary text-center h-100 d-flex flex-column w-100"
                             style="cursor: pointer;"
                             data-bs-toggle="collapse"
                             th:data-bs-target="'#collapse-day-' + ${day.id}"
                             aria-expanded="false"
                             th:aria-controls="'collapse-day-' + ${day.id}">

                            <strong th:text="${day.weekday}">Montag</strong>
                            <ul class="list-unstyled mt-2 flex-grow-1">
                                <li th:each="ex : ${day.personalExercises}" th:text="${ex.name} + ' - '   + 'X'  + ${ex.sets} "></li>
                                <li th:if="${#lists.isEmpty(day.personalExercises)}" class="text-muted">RESTDAY</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Collapsible Forms for Logging Workouts -->
            <div class="accordion" id="workoutAccordion">
                <div th:each="day : ${split?.days}"
                     class="collapse mt-3"
                     th:classappend="${day.weekday.name() == currentDayOfWeek ? 'show' : ''}"
                     th:id="'collapse-day-' + ${day.id}"
                     data-bs-parent="#workoutAccordion">
                    <div class="card card-body">
                        <h4 th:text="'Log Workout: ' + ${day.weekday}"></h4>

                        <form class="workout-log-form" th:action="@{/workouts/log}" method="post">
                            <input type="hidden" name="trainingDayId" th:value="${day.id}"/>

                            <div class="planned-exercises">
                                <div th:each="exercise : ${day.personalExercises}" class="mb-3 row align-items-start exercise-log-row planned-row">
                                    <label class="col-sm-3 col-form-label fw-bold" th:text="${exercise.name}"></label>
                                    <input type="hidden" class="personal-exercise-id" th:value="${exercise.id}"/>
                                    <div class="col-sm-2">
                                        <div class="input-group">
                                            <span class="input-group-text">Sets</span>
                                            <input type="number" class="form-control sets-input" th:value="${exercise.sets}" required>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="reps-container d-flex flex-column gap-1"></div>
                                    </div>
                                    <div class="col-sm-1">
                                        <button type="button" class="btn btn-sm btn-danger remove-row-btn">X</button>
                                    </div>
                                </div>
                            </div>

                            <div class="adhoc-exercises-container"></div>

                            <button type="button" class="btn btn-outline-primary mt-3 add-adhoc-exercise-btn">+ Add Extra Exercise</button>
                            <button type="submit" class="btn btn-success mt-3">Log Workout</button>

                            <!-- Rest Day Button -->
                            <button type="submit" formaction="/workouts/log-restday" class="btn btn-info mt-3">Mark as Rest Day</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Progress Graph Section -->
        <div class="p-4 mt-4 bg-body-tertiary rounded-3">
            <h3>Progress Tracker</h3>
            <div class="mb-3" style="max-width: 400px;">
                <label for="progressExerciseSelect" class="form-label">Select Exercise</label>
                <select class="form-select" id="progressExerciseSelect">
                    <option value="" selected disabled>Choose exercise...</option>
                    <option th:each="ex : ${allExercises}" th:value="${ex.id}" th:text="${ex.name}"></option>
                </select>
            </div>
            <div style="height: 400px; position: relative;">
                <canvas id="progressChart"></canvas>
                <div id="chartMessage" class="position-absolute top-50 start-50 translate-middle text-muted" style="display: none;">
                    No data available for this exercise.
                </div>
            </div>
        </div>

        <!-- Include Edit Split Modal -->
        <div th:replace="~{fragments/training_dialogs/editSplitModal :: editSplitModal}"></div>

    </main>

    <script th:inline="javascript">
    /*<![CDATA[*/
        // Define server-side data as global JS variables
        window.loggedDayId = /*[[${loggedDayId}]]*/ null;
        window.todaysWorkout = /*[[${todaysWorkout}]]*/ null;
        window.allExercises = /*[[${allExercises}]]*/ [];

        $(document).ready(function() {
            // Initialize rep inputs for the auto-expanded day
            $('.collapse.show').find('.sets-input').each(function() {
                if (typeof generateSetInputs === 'function') {
                    generateSetInputs(this);
                }
            });

            // --- Progress Chart Logic ---
            let progressChart = null;

            $('#progressExerciseSelect').change(function() {
                const exerciseId = $(this).val();
                if (!exerciseId) return;

                console.log("Fetching progress for exercise:", exerciseId);

                const token = $("meta[name='_csrf']").attr("content");
                const header = $("meta[name='_csrf_header']").attr("content");

                fetch(`/workouts/api/progress?exerciseId=${exerciseId}`, {
                    headers: {
                        'Accept': 'application/json',
                        [header]: token
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok: ' + response.statusText);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("Progress data received:", data);

                    const chartMessage = document.getElementById('chartMessage');
                    const canvas = document.getElementById('progressChart');

                    if (!data || data.length === 0) {
                        console.log("No data points found.");
                        if (progressChart) {
                            progressChart.destroy();
                            progressChart = null;
                        }
                        chartMessage.style.display = 'block';
                        return;
                    }

                    chartMessage.style.display = 'none';
                    const labels = data.map(d => d.date);
                    const weights = data.map(d => d.weight);

                    const ctx = canvas.getContext('2d');

                    if (progressChart) {
                        progressChart.destroy();
                    }

                    if (typeof Chart === 'undefined') {
                        console.error("Chart.js library is not loaded!");
                        return;
                    }

                    progressChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Max Weight (kg)',
                                data: weights,
                                borderColor: 'rgba(75, 192, 192, 1)',
                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                borderWidth: 2,
                                tension: 0.1,
                                pointRadius: 5,
                                pointHoverRadius: 7
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: false,
                                    title: {
                                        display: true,
                                        text: 'Weight (kg)'
                                    }
                                },
                                x: {
                                    title: {
                                        display: true,
                                        text: 'Date'
                                    }
                                }
                            },
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'top'
                                },
                                tooltip: {
                                    enabled: true
                                }
                            }
                        }
                    });
                })
                .catch(error => console.error('Error fetching progress data:', error));
            });
        });
    /*]]>*/
    </script>
    <script src="/js/workout-logger.js"></script>

    <style>
        .deleted-exercise { text-decoration: line-through; background-color: #ffe6e6; opacity: 0.7; }
    </style>
</div>
</body>
</html>
