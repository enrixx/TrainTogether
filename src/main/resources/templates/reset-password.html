<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{authenticate :: authlayout(~{::authContent})}">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
</head>
<body>
<form th:fragment="authContent" th:action="@{/reset-password(token=${token})}" method="post" class="mx-auto" th:object="${resetPasswordDto}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <h1 class="h3 mb-3 fw-normal" th:text="#{auth.reset.password.title}">Reset Your Password</h1>

    <p class="text-muted mb-4" th:text="#{auth.reset.password.description}">
        Please enter your new password.
    </p>

    <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
        Error message
    </div>

    <div class="form-floating mb-3">
        <input type="password"
               th:field="*{password}"
               class="form-control"
               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
               id="floatingPassword"
               placeholder="Password"
               required>
        <label for="floatingPassword" th:text="#{auth.new.password}">New Password</label>
        <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback">
            <span th:errors="*{password}">Password error</span>
        </div>
    </div>

    <div class="form-floating mb-3">
        <input type="password"
               th:field="*{confirmPassword}"
               class="form-control"
               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
               id="floatingConfirmPassword"
               placeholder="Confirm Password"
               required>
        <label for="floatingConfirmPassword" th:text="#{auth.confirm.password}">Confirm Password</label>
        <div th:if="${#fields.hasErrors('confirmPassword')}" class="invalid-feedback">
            <span th:errors="*{confirmPassword}">Confirm password error</span>
        </div>
    </div>

    <button class="btn btn-primary w-100 py-2 mb-3" type="submit" th:text="#{auth.reset.password.submit}">
        Reset Password
    </button>

    <div class="text-center">
        <a th:href="@{/login}" class="text-decoration-none" th:text="#{auth.back.to.login}">Back to Login</a>
    </div>
</form>
</body>
</html>
