<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.friends}">Friends</title>
</head>
<body>
<div th:fragment="content" class="container py-4">
    <div class="row">
        <div class="col-md-8">
            <h2 class="mb-4" th:text="#{friends.title}">My Friends</h2>

            <!-- Unblock Confirmation -->
            <div th:if="${confirmUnblockIdentifier}" class="alert alert-warning alert-dismissible fade show" role="alert">
                <strong th:text="${errorMessage}">Error</strong>
                <form th:action="@{/friends/request}" method="post" class="mt-2">
                    <input type="hidden" name="identifier" th:value="${confirmUnblockIdentifier}">
                    <input type="hidden" name="unblock" value="true">
                    <button type="submit" class="btn btn-warning btn-sm" th:text="#{friends.unblock.confirm.button}">Unblock and Add</button>
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="alert" th:text="#{friends.unblock.cancel.button}">Cancel</button>
                </form>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Add Friend Form -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title" th:text="#{friends.add.title}">Add Friend</h5>
                    <form th:action="@{/friends/request}" method="post" class="row g-3">
                        <div class="col-md-9">
                            <input type="text" class="form-control" name="identifier"
                                   th:placeholder="#{friends.add.placeholder}" required>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100" th:text="#{friends.add.button}">Send Request</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Pending Requests -->
            <div th:if="${not #lists.isEmpty(pendingRequests)}" class="card mb-4">
                <div class="card-header" th:text="#{friends.requests.title}">
                    Pending Requests
                </div>
                <ul class="list-group list-group-flush">
                    <li th:each="request : ${pendingRequests}" class="list-group-item d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <img th:if="${request.requester.profilePictureUrl}" th:src="${request.requester.profilePictureUrl}"
                                 class="rounded-circle me-3" width="40" height="40" alt="Profile">
                            <img th:unless="${request.requester.profilePictureUrl}" th:src="@{/images/default-profile.png}"
                                 class="rounded-circle me-3" width="40" height="40" alt="Profile">
                            <div>
                                <h6 class="mb-0" th:text="${request.requester.firstName} + ' ' + ${request.requester.lastName}">Name</h6>
                                <small class="text-muted" th:text="${request.requester.email}">Email</small>
                            </div>
                        </div>
                        <div>
                            <form th:action="@{/friends/{id}/accept(id=${request.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-success btn-sm me-2" th:text="#{friends.request.accept}">Accept</button>
                            </form>
                            <form th:action="@{/friends/{id}/decline(id=${request.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-danger btn-sm" th:text="#{friends.request.decline}">Decline</button>
                            </form>
                        </div>
                    </li>
                </ul>
            </div>

            <!-- Sent Requests -->
            <div th:if="${not #lists.isEmpty(sentRequests)}" class="card mb-4">
                <div class="card-header" th:text="#{friends.sent.requests.title}">
                    Sent Requests
                </div>
                <ul class="list-group list-group-flush">
                    <li th:each="request : ${sentRequests}" class="list-group-item d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <img th:if="${request.addressee.profilePictureUrl}" th:src="${request.addressee.profilePictureUrl}"
                                 class="rounded-circle me-3" width="40" height="40" alt="Profile">
                            <img th:unless="${request.addressee.profilePictureUrl}" th:src="@{/images/default-profile.png}"
                                 class="rounded-circle me-3" width="40" height="40" alt="Profile">
                            <div>
                                <h6 class="mb-0" th:text="${request.addressee.firstName} + ' ' + ${request.addressee.lastName}">Name</h6>
                                <small class="text-muted" th:text="${request.addressee.email}">Email</small>
                            </div>
                        </div>
                        <div>
                            <form th:action="@{/friends/{id}/cancel(id=${request.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-secondary btn-sm" th:text="#{friends.action.cancel}">Cancel Request</button>
                            </form>
                        </div>
                    </li>
                </ul>
            </div>

            <!-- Friends List -->
            <div class="card">
                <div class="card-header" th:text="#{friends.list.title}">
                    Friends List
                </div>
                <ul class="list-group list-group-flush">
                    <li th:if="${#lists.isEmpty(friends)}" class="list-group-item text-muted" th:text="#{friends.list.empty}">
                        No friends yet.
                    </li>
                    <li th:each="friend : ${friends}" class="list-group-item d-flex justify-content-between align-items-center">
                        <a th:href="@{/friends/chat/{id}(id=${friend.id})}" class="d-flex align-items-center text-decoration-none text-reset flex-grow-1">
                            <img th:if="${friend.profilePictureUrl}" th:src="${friend.profilePictureUrl}"
                                 class="rounded-circle me-3" width="40" height="40" alt="Profile">
                            <img th:unless="${friend.profilePictureUrl}" th:src="@{/images/default-profile.png}"
                                 class="rounded-circle me-3" width="40" height="40" alt="Profile">
                            <div>
                                <h6 class="mb-0" th:text="${friend.firstName} + ' ' + ${friend.lastName}">Name</h6>
                                <small class="text-muted" th:text="${friend.email}">Email</small>
                            </div>
                        </a>
                        <div class="dropdown">
                            <button class="btn btn-link text-reset" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-three-dots-vertical"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <form th:action="@{/friends/remove}" method="post">
                                        <input type="hidden" name="friendId" th:value="${friend.id}">
                                        <button type="submit" class="dropdown-item text-danger" th:text="#{friends.action.remove}">Remove Friend</button>
                                    </form>
                                </li>
                                <li>
                                    <form th:action="@{/friends/block}" method="post">
                                        <input type="hidden" name="userId" th:value="${friend.id}">
                                        <button type="submit" class="dropdown-item text-danger" th:text="#{friends.action.block}">Block</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>

            <!-- Blocked Users -->
            <div th:if="${not #lists.isEmpty(blockedUsers)}" class="card mt-4">
                <div class="card-header text-danger" th:text="#{friends.blocked.title}">
                    Blocked Users
                </div>
                <ul class="list-group list-group-flush">
                    <li th:each="blocked : ${blockedUsers}" class="list-group-item d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <img th:if="${blocked.profilePictureUrl}" th:src="${blocked.profilePictureUrl}"
                                 class="rounded-circle me-3" width="40" height="40" alt="Profile">
                            <img th:unless="${blocked.profilePictureUrl}" th:src="@{/images/default-profile.png}"
                                 class="rounded-circle me-3" width="40" height="40" alt="Profile">
                            <div>
                                <h6 class="mb-0" th:text="${blocked.firstName} + ' ' + ${blocked.lastName}">Name</h6>
                                <small class="text-muted" th:text="${blocked.email}">Email</small>
                            </div>
                        </div>
                        <form th:action="@{/friends/unblock}" method="post">
                            <input type="hidden" name="userId" th:value="${blocked.id}">
                            <button type="submit" class="btn btn-outline-secondary btn-sm" th:text="#{friends.blocked.unblock.button}">Unblock</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
</body>
</html>
