<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>App Bar</title>
</head>
<body>

<div th:fragment="appbar">
    <div class="p-3 bg-body-secondary d-flex flex-wrap align-items-center w-100">

        <div class="d-flex align-items-center me-auto">
            <a href="/" class="d-flex align-items-center text-dark text-decoration-none" style="height: 40px;">
                <span class="fs-4">Train Together</span>
            </a>
        </div>

        <div class="dropdown d-flex align-items-center">
            <a href="#" data-bs-toggle="dropdown" aria-expanded="false" class="d-inline-block">
                <img sec:authorize="isAnonymous()" th:src="@{/images/svg/person-circle.svg}" alt="Profile" width="40" height="40" />
                <!-- TODO: add user image-->
                <img sec:authorize="isAuthenticated()" th:src="@{/images/svg/person-check-fill.svg}" alt="Profile" width="40" height="40" />
            </a>
            <ul class="dropdown-menu dropdown-menu-end text-small">
                <li sec:authorize="isAuthenticated()"><a class="dropdown-item" href="/profile">Profile</a></li>
                <li>
                    <button id="theme-toggle" class="dropdown-item" type="button">
                        Switch to: <span id="theme-label">Dark</span>
                    </button>
                </li>

                <li>
                    <hr class="dropdown-divider">
                </li>

                <!-- Animated Language Toggle -->
                <li class="px-3 py-2">
                    <a id="langToggle"
                       class="btn border rounded-pill w-100 position-relative p-1 shadow-sm bg-body-tertiary"
                       th:with="isGerman=${#locale.language == 'de'}"
                       th:href="@{''(lang=${isGerman ? 'en' : 'de'})}"
                       onclick="animateLangSwitch(event, this)"
                       style="height: 42px; overflow: hidden;">

                        <!-- Background Labels (Fixed Positions) -->
                        <div class="d-flex justify-content-between align-items-center w-100 h-100 px-2 position-absolute top-0 start-0 text-secondary fw-bold small"
                             style="z-index: 0;">
                            <span style="padding-left: 6px;">DE</span>
                            <span style="padding-right: 6px;">EN</span>
                        </div>

                        <!-- Sliding Flag Circle -->
                        <div id="flagSlider"
                             class="bg-white rounded-circle d-flex align-items-center justify-content-center shadow-sm position-absolute"
                             th:style="${isGerman} ? 'width: 32px; height: 32px; top: 4px; left: calc(100% - 36px); transition: all 0.2s ease-in-out; z-index: 1;'
                                                   : 'width: 32px; height: 32px; top: 4px; left: 4px; transition: all 0.2s ease-in-out; z-index: 1;'">
                            <span th:text="${isGerman ? '🇩🇪' : '🇬🇧'}" class="fs-6" style="line-height: 1;"></span>
                        </div>
                    </a>
                </li>

                <!-- Inline Script to Handle Animation Before Reload -->
                <script>
                    function animateLangSwitch(e, element) {
                        e.preventDefault();
                        e.stopPropagation(); // 2. STOP BOOTSTRAP FROM CLOSING THE DROPDOWN

                        const slider = element.querySelector('#flagSlider');
                        const targetUrl = element.getAttribute('href');

                        const currentLeft = slider.style.left;
                        const isCurrentlyRight = currentLeft.includes('calc') || currentLeft.includes('%');

                        // Animate to the opposite side
                        if (isCurrentlyRight) {
                            slider.style.left = '4px';
                        } else {
                            slider.style.left = 'calc(100% - 36px)';
                        }

                        // Wait 100ms for CSS transition, then reload
                        setTimeout(() => {
                            window.location.href = targetUrl;
                        }, 200);
                    }
                </script>

                <li>
                    <hr class="dropdown-divider">
                </li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="dropdown-item" th:text="#{auth.sign.out}">Sign out</button>
                    </form>
                </li>
                <li sec:authorize="isAnonymous()"><a class="dropdown-item" href="/login" th:text="#{auth.sign.in}">Sign
                    in</a></li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>
