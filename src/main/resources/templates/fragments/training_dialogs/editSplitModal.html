<div th:fragment="editSplitModal" xmlns:th="http://www.thymeleaf.org">
    <div class="modal fade" id="editSplitModal" tabindex="-1" aria-hidden="true" data-bs-target="#staticBackdrop">
        <div class="modal-dialog" style="max-width: 95%;">
            <div class="modal-content" >

                <div class="modal-header">
                    <h5 class="modal-title" th:text="#{workouts.split.edit}">Trainingssplit bearbeiten</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <ul class="nav nav-tabs" id="splitTabs" role="tablist">
                        <li class="nav-item" th:each="split, iter : ${splits}">
                            <button class="nav-link d-flex align-items-center gap-2"
                                    th:classappend="${iter.index == 0} ? 'active'"
                                    th:id="'tab-' + ${split.id}"
                                    data-bs-toggle="tab"
                                    th:data-bs-target="'#content-' + ${split.id}"
                                    type="button"
                                    role="tab">
                                <span th:text="${split.splitName}"></span>

                                <!-- Set Active Split Icon -->
                                <span th:if="${split.id == activeSplit}" class="text-warning" title="Aktiver Split">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-star-fill" viewBox="0 0 16 16">
                                      <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/>
                                    </svg>
                                </span>
                                <span th:unless="${split.id == activeSplit}"
                                      class="text-secondary set-active-split-btn"
                                      th:data-split-id="${split.id}"
                                      style="cursor: pointer;"
                                      title="Als aktiv setzen">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-star" viewBox="0 0 16 16">
                                      <path d="M2.866 14.85c-.078.444.36.791.746.593l4.39-2.256 4.389 2.256c.386.198.824-.149.746-.592l-.83-4.73 3.522-3.356c.33-.314.16-.888-.282-.95l-4.898-.696L8.465.792a.513.513 0 0 0-.927 0L5.354 5.12l-4.898.696c-.441.062-.612.636-.283.95l3.523 3.356-.83 4.73zm4.905-2.767-3.686 1.894.694-3.957a.565.565 0 0 0-.163-.505L1.71 6.745l4.052-.576a.525.525 0 0 0 .393-.288L8 2.223l1.847 3.658a.525.525 0 0 0 .393.288l4.052.575-2.906 2.77a.565.565 0 0 0-.163.506l.694 3.957-3.686-1.894a.503.503 0 0 0-.461 0z"/>
                                    </svg>
                                </span>

                                <!-- Delete Split Icon -->
                                <span class="text-danger delete-split-btn"
                                      th:data-split-id="${split.id}"
                                      style="cursor: pointer;"
                                      title="Split löschen">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                                      <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                                      <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                                    </svg>
                                </span>
                            </button>
                        </li>

                        <li class="nav-item">
                            <button class="nav-link"
                                    id="new-split-tab"
                                    data-bs-toggle="tab"
                                    data-bs-target="#new-split-content"
                                    type="button" role="tab" th:text="#{workouts.split.new}">
                                + Neuer Split
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content mt-3">
                        <div th:each="split, iter : ${splits}"
                             class="tab-pane fade"
                             th:classappend="${iter.index == 0} ? 'show active'"
                             th:id="'content-' + ${split.id}"
                             role="tabpanel">

                        <!-- EXISTIERENDE SPLITS -->
                        <div class="container-fluid text-center">
                            <div class="row" >
                                <div class="col day-column" th:each="weekday : ${T(java.time.DayOfWeek).values()}"
                                                 th:with="matchingDay=${split.days[weekday.ordinal()]}">
                                    <h6 th:text="${weekday}"></h6>

                                    <ul class="list-group mb-2" th:if="${matchingDay != null}" th:data-day-id="${matchingDay.id}">
                                        <li class="list-group-item d-flex justify-content-between align-items-center exercise-item"
                                            th:each="ex : ${matchingDay.personalExercises}"
                                            th:data-exercise-id="${ex.id}">
                                            <span class="exercise-name" th:text="${ex.name}"></span>
                                            <div class="d-flex align-items-center gap-2">
                                                <span class="badge bg-primary rounded-pill" th:text="${ex.sets} + ' ' + #{workouts.sets}"></span>

                                                <!-- Mark for Deletion Button -->
                                                <span class="text-danger mark-delete-btn"
                                                      style="cursor: pointer;"
                                                      title="Übung entfernen">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                                                      <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                                                      <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                                                    </svg>
                                                </span>

                                                <!-- Undo Deletion Button (Hidden by default) -->
                                                <span class="text-secondary undo-delete-btn"
                                                      style="cursor: pointer; display: none;"
                                                      title="Entfernen rückgängig machen">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-counterclockwise" viewBox="0 0 16 16">
                                                      <path fill-rule="evenodd" d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2v1z"/>
                                                      <path d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466z"/>
                                                    </svg>
                                                </span>
                                            </div>
                                        </li>
                                    </ul>

                                    <!-- Container for adding exercises -->
                                    <div th:if="${matchingDay != null}"
                                         class="exercise-select-container"
                                         th:data-day-id="${matchingDay.id}">

                                        <div class="exercise-select mb-1 row g-1">
                                            <div class="col-8">
                                                <select class="form-select form-select-sm exercise-dropdown"
                                                        onchange="addExerciseSelectIfNeeded(this)">
                                                    <option value="" th:text="#{workouts.add.exercise}">+ Übung hinzufügen...</option>
                                                    <option th:each="ex : ${allExercises}"
                                                            th:value="${ex.value}"
                                                            th:text="${ex.name}">
                                                    </option>
                                                </select>
                                            </div>
                                            <div class="col-4">
                                                <input type="number" class="form-control form-select-sm sets-input" th:placeholder="#{workouts.sets}" min="1" value="3">
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                        </div>


                        <!-- NEUEN SPLIT ANLEGEN -->
                        <div class="tab-pane fade"
                             id="new-split-content" role="tabpanel">
                            <h5 th:text="#{workouts.split.new}">Neuen Split erstellen</h5>

                            <form th:action="@{/training/profile/me/create-split}" method="post">
                                <label th:text="#{workouts.split.name}">Split-Name</label>
                                <input type="text" name="splitName" class="form-control" minlength="1">

                                <button type="submit" class="btn btn-success mt-3" th:text="#{workouts.create}">
                                    Erstellen
                                </button>
                            </form>
                        </div>

                    </div>

                </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{workouts.close}">Schließen</button>
                        <button type="button" id="save-exercises-btn" class="btn btn-primary" th:text="#{workouts.save}">Speichern</button>
                    </div>

            </div>
        </div>
    </div>
</div>
