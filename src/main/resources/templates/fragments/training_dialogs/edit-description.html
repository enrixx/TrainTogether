<!DOCTYPE html>
<html lang="en">
<body>

<div th:fragment="editDescriptionModal">
    <div class="modal fade" id="editDescriptionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <form th:action="@{/training/profile/update-description}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Beschreibung bearbeiten</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <textarea class="form-control" name="description" rows="5"
                                  th:text="${profile.description}"></textarea>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                        <button type="submit" class="btn btn-primary">Speichern</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

</body>
</html>
