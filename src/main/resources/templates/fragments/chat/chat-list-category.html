<!DOCTYPE html>
<html lang="en">
<div th:fragment="chatListCategory(chats, title)" th:if="${chats != null}" class="mb-2">
    <a data-bs-toggle="collapse" th:href="@{#collapseChats{section}(section=${title.replaceAll(' ', '')})}" role="button"
       aria-expanded="false" th:aria-controls="@{collapseChats{section}(section=${title.replaceAll(' ', '')})}" class="text-decoration-none">
        <div class="bg-body-secondary p-1">
            <h4 class=" text-muted mb-2" th:text="${title}">Section</h4>
        </div>
    </a>
    <div class="collapse show" th:id="@{collapseChats{section}(section=${title.replaceAll(' ', '')})}">
        <ul class="list-unstyled mb-0">
            <li th:each="g,iterStat : ${chats}" th:class="${iterStat.last} ? 'p-2 pe-3 border-bottom-0' : 'p-2 pe-3 border-bottom'">
                <a th:href="@{/chat/{id}(id=${g.id})}" class="d-flex justify-content-between text-decoration-none">
                    <div class="d-flex flex-row">
                        <div>
                            <img
                                    th:src="${g.pictureUrl}"
                                    alt="avatar" class="d-flex align-self-center me-3"
                                    width="60">
                            <span class="badge bg-success badge-dot"></span>
                        </div>
                        <div class="pt-1">
                            <p class="fw-bold mb-0" th:text="${g.name}">Group name</p>
                        </div>
                    </div>
                    <div th:if="${false}" class="pt-1">
                        <p class="small text-muted mb-1">Just now</p>
                        <span class="badge bg-danger rounded-pill float-end">3</span>
                    </div>
                </a>
            </li>
        </ul>
    </div>
</div>
