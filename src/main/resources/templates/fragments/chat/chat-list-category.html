<div th:fragment="chatListCategory(chats, title)" th:if="${chats != null && chats.size() > 0}" class="mb-2">
    <a data-bs-toggle="collapse" th:href="@{#collapseChats{section}(section=${title.replaceAll(' ', '')})}"
       role="button"
       aria-expanded="false" th:aria-controls="@{collapseChats{section}(section=${title.replaceAll(' ', '')})}"
       class="text-decoration-none">
        <div class="bg-body-secondary p-1">
            <h4 class=" text-muted mb-2" th:text="${title}">Section</h4>
        </div>
    </a>
    <div class="collapse show" th:id="@{collapseChats{section}(section=${title.replaceAll(' ', '')})}">
        <ul class="list-unstyled mb-0">
            <li th:each="g,iterStat : ${chats}"
                th:class="${iterStat.last} ? 'p-2 pe-3 border-bottom-0' : 'p-2 pe-3 border-bottom'">
                <a th:href="@{/chat/{id}(id=${g.id})}" class="d-flex justify-content-between text-decoration-none">
                    <div class="d-flex flex-row" style="width: 90%">
                        <span th:if="${messagePage != null and messagePage.roomId == g.id}"
                              class="bg-primary align-self-stretch d-block rounded me-2" style="width:5px" aria-hidden="true"></span>
                        <div>
                            <img
                                    th:src="${g.pictureUrl}"
                                    alt="avatar" class="d-flex align-self-center me-3"
                                    width="60">
                            <span class="badge bg-success badge-dot"></span>
                        </div>
                        <div class="pt-1 overflow-hidden">
                            <p class="fw-bold mb-0" th:text="${g.name}">Group name</p>
                            <p th:if="${g.containsMessage}" class="small text-muted"
                               style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"
                               th:text="${g.lastMessagePreview}">Message</p>
                        </div>
                    </div>
                    <div th:if="${g.containsMessage}" class="pt-1">
                        <p class="small text-muted mb-1" th:text="${g.lastMessageAt}">Just now</p>
                        <span th:if="${g.unreadMessagesCount != '0'}" class="badge bg-danger rounded-pill float-end"
                              th:text="${g.unreadMessagesCount}">0</span>
                    </div>
                </a>
            </li>
        </ul>
    </div>
</div>
