<div th:fragment="chatListCategory(chats, title)" th:if="${chats != null && chats.size() > 0}" class="mb-2">
    <a data-bs-toggle="collapse" th:href="@{#collapseChats{section}(section=${title.replaceAll(' ', '')})}"
       role="button"
       aria-expanded="false" th:aria-controls="@{collapseChats{section}(section=${title.replaceAll(' ', '')})}"
       class="text-decoration-none">
        <div class="bg-body-secondary p-1">
            <h4 class=" text-muted mb-2" th:text="${title}">Section</h4>
        </div>
    </a>
    <div class="collapse show" th:id="@{collapseChats{section}(section=${title.replaceAll(' ', '')})}">
        <ul class="list-unstyled mb-0">
            <li th:each="chat,iterStat : ${chats}"
                th:id="'message-' + ${chat.id}"
                th:class="${iterStat.last} ? 'p-2 border-bottom-0' : 'p-2 border-bottom'">
                <div class="d-flex flex-row gap-2">
                    <a th:href="@{/chat/{id}(id=${chat.id})}"
                       class="d-flex justify-content-between text-decoration-none w-100"
                       style="max-width: calc(100% - 33px);">
                        <div class="d-flex flex-row" style="width: 90%">
                        <span th:if="${messagePage != null and messagePage.roomId == chat.id}"
                              class="bg-primary align-self-stretch d-block rounded me-2" style="width:5px"
                              aria-hidden="true"></span>
                            <div>
                                <img
                                        th:src="${chat.pictureUrl}"
                                        alt="avatar" class="d-flex align-self-center me-3"
                                        width="60">
                                <span class="badge bg-success badge-dot"></span>
                            </div>
                            <div class="pt-1 overflow-hidden">
                                <p class="fw-bold mb-0" th:text="${chat.name}">Group name</p>
                                <p th:if="${chat.containsMessage}" class="small text-muted"
                                   style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"
                                   th:text="${chat.lastMessagePreview}">Message</p>
                            </div>
                        </div>
                        <div th:if="${chat.containsMessage}" class="pt-1">
                            <p class="small text-muted mb-1" th:text="${chat.lastMessageAt}">Just now</p>
                            <span th:if="${chat.unreadMessagesCount != '0'}"
                                  class="badge bg-danger rounded-pill float-end"
                                  th:text="${chat.unreadMessagesCount}">0</span>
                        </div>
                    </a>
                    <div class="dropdown">
                        <a href="#" data-bs-toggle="dropdown" aria-expanded="false" class="d-inline-block">
                            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="16" fill="currentColor"
                                 style="color: var(--bs-primary)"
                                 class="bi bi-three-dots-vertical" viewBox="0 0 16 16">
                                <path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
                            </svg>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end text-small">
                            <li th:if="${chat.roomType == 'GROUP'}">
                                <a class="dropdown-item" th:href="@{/chat/{id}/settings(id=${chat.id})}"
                                   th:text="#{chat.settings}">Settings</a>
                            </li>
                            <li th:if="${chat.roomType == 'GROUP'}">
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <button class="dropdown-item"
                                        th:attr="data-delete-url=@{/chat/{id}/members/me(id=${chat.id})}, data-confirm=#{chat.leave_confirm}, data-target=|message-${chat.id}|"
                                        th:onclick="|fetchDelete(this.dataset.deleteUrl, this.dataset.confirm, this.dataset.target)|">
                                    <span th:if="${chat.roomType == 'DM'}" th:text="#{chat.remove}">Remove</span>
                                    <span th:if="${chat.roomType == 'GROUP'}" th:text="#{chat.leave_group}">Leave</span>
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</div>
