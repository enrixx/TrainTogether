<div th:fragment="chatMessageContent(message)">
    <div th:if="${message.attachment}">
        <!-- Attachment display: image preview or file card -->
        <div class="mt-1">
            <!-- Image preview -->
            <div th:if="${#strings.startsWith(message.attachment.mimeType,'image/')}">
                <a th:href="${message.attachment.fileUrl}" target="_blank" rel="noopener noreferrer">
                    <img th:src="${message.attachment.fileUrl}"
                         th:alt="${message.attachment.fileName}"
                         class="img-fluid rounded-3"
                         style="max-height:300px; max-width: 100%; object-fit:contain;"/>
                </a>
                <div class="small text-muted mt-1 text-white" style="max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                    <a th:href="${message.attachment.fileUrl}" th:text="${message.attachment.fileName}" target="_blank" rel="noopener noreferrer" class="text-decoration-none text-reset" ></a>
                </div>
            </div>

            <!-- Generic file card -->
            <div th:if="${!#strings.startsWith(message.attachment.mimeType,'image/')}">
                <a th:href="${message.attachment.fileUrl}" target="_blank" rel="noopener noreferrer" class="d-flex align-items-center text-decoration-none text-reset">
                    <div class="d-flex align-items-center justify-content-center me-2" style="width:40px; height:40px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-file-earmark" viewBox="0 0 16 16">
                            <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5z"/>
                        </svg>
                    </div>
                    <div style="max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        <div class="fw-bold small text-white" th:text="${message.attachment.fileName}">file.pdf</div>
                        <div class="small text-muted" th:text="${message.attachment.mimeType}">application/pdf</div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <div class="small text-white"
         th:text="${message.content}"
         style="white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;">
        Message
    </div>
</div>
