<!DOCTYPE html>
<html lang="en">
<div th:fragment="chatList" class="col-md-6 col-lg-5 col-xl-4 mb-4 mb-md-0 p-3 pe-0 d-flex flex-column h-100">
    <div class="input-group rounded mb-3">
        <input type="search" class="form-control rounded" placeholder="Search"
               aria-label="Search"
               aria-describedby="search-addon"/>
        <svg style="height: 100%; width: auto; padding: 8px;" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
        </svg>
    </div>

    <div class="flex-grow-1 overflow-auto">
        <ul class="list-unstyled mb-0">
            <li class="p-2 pe-3 border-bottom">
                <a href="#!" class="d-flex justify-content-between">
                    <div class="d-flex flex-row">
                        <div>
                            <img
                                    src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-chat/ava1-bg.webp"
                                    alt="avatar" class="d-flex align-self-center me-3"
                                    width="60">
                            <span class="badge bg-success badge-dot"></span>
                        </div>
                        <div class="pt-1">
                            <p class="fw-bold mb-0">Marie Horwitz</p>
                            <p class="small text-muted">Hello, Are you there?</p>
                        </div>
                    </div>
                    <div class="pt-1">
                        <p class="small text-muted mb-1">Just now</p>
                        <span class="badge bg-danger rounded-pill float-end">3</span>
                    </div>
                </a>
            </li>
        </ul>
        <div th:replace="~{fragments/chat/chat-list-category :: chatListCategory(chats=${groups}, title='Groups')}"></div>
        <div th:replace="~{fragments/chat/chat-list-category :: chatListCategory(chats=${dms}, title='Direct Messages')}"></div>
    </div>
</div>
</html>
