<div th:fragment="chatDetails(chatDetails)" class="col-lg-4 col-md-5">
    <div class="card">
        <div class="card-body text-center">
            <img th:src="${chatDetails.pictureUrl}" alt="avatar" class="rounded-circle mb-3" width="120" height="120">
            <h4 class="card-title mb-1" th:text="${chatDetails.name}">Sample Group</h4>
            <p class="text-muted mb-2" th:text="|${#strings.toLowerCase(chatDetails.type)} - ${chatDetails.memberCount} #{chat.members.suffix}|">Group 0 members</p>
        </div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span th:text="#{chat.type.label}">Type</span>
                <span class="badge bg-secondary rounded-pill" th:text="${chatDetails.type}">GROUP</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span th:text="#{chat.created.label}">Created</span>
                <span class="text-muted" th:text="${chatDetails.createdAt}">00-00-0000</span>
            </li>
            <li th:if="${!#strings.isEmpty(chatDetails.description)}" class="list-group-item">
                <strong th:text="#{chat.description.label}">Description</strong>
                <p class="mb-0 text-muted small" th:text="${chatDetails.description}">Description</p>
            </li>
        </ul>
    </div>
</div>
