<div th:fragment="toasts" xmlns:th="http://www.thymeleaf.org">
    <link rel="stylesheet" th:href="@{/css/toast.css}" />
    <div class="toast-container-fixed" th:if="${sendError != null or error != null or success != null or info != null}">
        <div class="toast align-items-center text-bg-danger border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true"
             th:if="${sendError != null or error != null}">
            <div class="d-flex">
                <div class="toast-body overflow-auto" th:text="${sendError != null ? sendError : error}">Error message</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>

        <div class="toast align-items-center text-bg-success border-0 mb-2" role="alert" aria-live="polite" aria-atomic="true"
             th:if="${success != null}">
            <div class="d-flex">
                <div class="toast-body overflow-auto" th:text="${success}">Success message</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>

        <div class="toast align-items-center text-bg-info border-0 mb-2" role="alert" aria-live="polite" aria-atomic="true"
             th:if="${info != null}">
            <div class="d-flex">
                <div class="toast-body overflow-auto" th:text="${info}">Info message</div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            var toastElList = [].slice.call(document.querySelectorAll('.toast'));
            toastElList.forEach(function (toastEl) {
                var toast = new bootstrap.Toast(toastEl, { delay: 10000, autohide: true });
                toast.show();
                toastEl.addEventListener('hidden.bs.toast', function () {
                    if (toastEl && toastEl.parentNode) {
                        toastEl.parentNode.removeChild(toastEl);
                    }
                });
            });
        });
    </script>
</div>
