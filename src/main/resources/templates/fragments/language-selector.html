<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Shared Script for Both Language Selectors -->
<script th:fragment="languageSelectorScript" th:inline="javascript">
    function animateLangSwitch(e, element, stopPropagation = false) {
        e.preventDefault();
        if (stopPropagation) {
            e.stopPropagation(); // Stop Bootstrap from closing the dropdown
        }

        // Find the slider within the clicked element
        const slider = element.querySelector('[data-flag-slider]');
        const targetUrl = element.getAttribute('href');

        if (!slider) return;

        const currentLeft = slider.style.left;
        const isCurrentlyRight = currentLeft.includes('calc') || currentLeft.includes('%');

        // Animate to the opposite side
        slider.style.left = isCurrentlyRight ? '4px' : 'calc(100% - 36px)';

        // Wait 200ms for CSS transition, then reload
        setTimeout(() => {
            window.location.href = targetUrl;
        }, 200);
    }
</script>

<!-- Language Selector Fragment (Fixed Position - for auth pages) -->
<div th:fragment="languageSelector" class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
    <a class="btn border rounded-pill position-relative p-1 shadow-sm bg-body-tertiary"
       th:with="isGerman=${#locale.language == 'de'}"
       th:href="@{''(lang=${isGerman ? 'en' : 'de'})}"
       onclick="animateLangSwitch(event, this, false)"
       style="height: 42px; width: 90px; overflow: hidden; display: block;">

        <!-- Background Labels (Fixed Positions) -->
        <div class="d-flex justify-content-between align-items-center w-100 h-100 px-2 position-absolute top-0 start-0 text-secondary fw-bold small"
             style="z-index: 0;">
            <span style="padding-left: 6px;">DE</span>
            <span style="padding-right: 6px;">EN</span>
        </div>

        <!-- Sliding Flag Circle -->
        <div data-flag-slider
             class="bg-white rounded-circle d-flex align-items-center justify-content-center shadow-sm position-absolute"
             th:style="${isGerman} ? 'width: 32px; height: 32px; top: 4px; left: calc(100% - 36px); transition: all 0.2s ease-in-out; z-index: 1;'
                                   : 'width: 32px; height: 32px; top: 4px; left: 4px; transition: all 0.2s ease-in-out; z-index: 1;'">
            <span th:text="${isGerman ? '🇩🇪' : '🇬🇧'}" class="fs-6" style="line-height: 1;"></span>
        </div>
    </a>
</div>

<!-- Language Selector for Dropdown Menu (no fixed position) -->
<li th:fragment="languageSelectorDropdown" class="px-3 py-2">
    <a class="btn border rounded-pill w-100 position-relative p-1 shadow-sm bg-body-tertiary"
       th:with="isGerman=${#locale.language == 'de'}"
       th:href="@{''(lang=${isGerman ? 'en' : 'de'})}"
       onclick="animateLangSwitch(event, this, true)"
       style="height: 42px; overflow: hidden;">

        <!-- Background Labels (Fixed Positions) -->
        <div class="d-flex justify-content-between align-items-center w-100 h-100 px-2 position-absolute top-0 start-0 text-secondary fw-bold small"
             style="z-index: 0;">
            <span style="padding-left: 6px;">DE</span>
            <span style="padding-right: 6px;">EN</span>
        </div>

        <!-- Sliding Flag Circle -->
        <div data-flag-slider
             class="bg-white rounded-circle d-flex align-items-center justify-content-center shadow-sm position-absolute"
             th:style="${isGerman} ? 'width: 32px; height: 32px; top: 4px; left: calc(100% - 36px); transition: all 0.2s ease-in-out; z-index: 1;'
                                   : 'width: 32px; height: 32px; top: 4px; left: 4px; transition: all 0.2s ease-in-out; z-index: 1;'">
            <span th:text="${isGerman ? '🇩🇪' : '🇬🇧'}" class="fs-6" style="line-height: 1;"></span>
        </div>
    </a>
</li>

</body>
</html>
