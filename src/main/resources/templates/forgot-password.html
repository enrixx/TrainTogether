<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{authenticate :: authlayout(~{::authContent})}">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
</head>
<body>
<form th:fragment="authContent" th:action="@{/forgot-password}" method="post" class="mx-auto" th:object="${forgotPasswordDto}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <h1 class="h3 mb-3 fw-normal" th:text="#{auth.forgot.password.title}">Reset Your Password</h1>

    <p class="text-muted mb-4" th:text="#{auth.forgot.password.description}">
        Enter your email address and we'll send you a link to reset your password.
    </p>

    <div th:if="${successMessage != null}" class="alert alert-success" role="alert" th:text="${successMessage}">
        Success message
    </div>

    <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
        Error message
    </div>

    <div class="form-floating mb-3">
        <input type="email"
               th:field="*{email}"
               class="form-control"
               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
               id="floatingInput"
               placeholder="name@example.com"
               required>
        <label for="floatingInput" th:text="#{auth.email}">Email address</label>
        <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback">
            <span th:errors="*{email}">Email error</span>
        </div>
    </div>

    <button class="btn btn-primary w-100 py-2 mb-3" type="submit" th:text="#{auth.forgot.password.submit}">
        Send Reset Link
    </button>

    <div class="text-center">
        <a th:href="@{/login}" class="text-decoration-none" th:text="#{auth.back.to.login}">Back to Login</a>
    </div>
</form>
</body>
</html>
